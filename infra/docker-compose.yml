# Local observability stack for tinyworld's /metrics endpoint.
#
#   docker compose -f infra/docker-compose.yml up -d
#   Grafana    -> http://localhost:3001   (admin / admin; tinyworld dashboard auto-loaded)
#   Prometheus -> http://localhost:9090
#
# Prometheus scrapes the game server's /metrics on the host, so start the
# server first:  node apps/server/dist/index.js  (or pnpm --filter @tinyworld/server dev).
# Run a k6 load test against it (see infra/k6) and watch the panels move.

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets the container reach the host server

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000" # host 3001 (the game server owns 3000)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
